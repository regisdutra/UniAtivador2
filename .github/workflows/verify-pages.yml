name: Verificar site UniAtivador2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-pages.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirmar que GitHub Pages responde e apresenta o gerador
        run: |
          python3 - <<'PY'
          import urllib.request,time,re
          urls=[
            'https://regisdutra.github.io/UniAtivador2/',
            'https://regisdutra.github.io/UniAtivador2/docs/'
          ]
          for url in urls:
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'UniAtivador2-Web-Check/1.0'})
                      with urllib.request.urlopen(req,timeout=12) as r:
                          body=r.read(150000).decode('utf-8','replace')
                          title=re.search(r'<title>(.*?)</title>',body,re.I|re.S)
                          print('HTTP',r.status,'url',r.geturl(),'title',title.group(1)[:100] if title else None,'bytes',len(body),'MAC-controls',all(k in body for k in ['macAuto','macManual']))
                          if r.status==200 and all(k in body for k in ['macAuto','macManual']):
                              print('Verified MAC-selector page:',r.geturl())
                              raise SystemExit(0)
                          break
                  except Exception as e:
                      print('Attempt',attempt+1,'failed:',type(e).__name__,str(e)[:150])
                      if attempt<2:time.sleep(3)
          raise SystemExit(1)
          PY
