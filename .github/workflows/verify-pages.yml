name: Verificar site UniAtivador2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-pages.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirmar que GitHub Pages responde e apresenta o gerador
        run: |
          python3 - <<'PY'
          import urllib.request,time,re
          urls=[
            'https://regisdutra.github.io/UniAtivador2/',
            'https://regisdutra.github.io/UniAtivador2/docs/',
            'https://regisdutra.github.io/UniAtivador2/painel-original.html'
          ]
          verified=0
          for url in urls:
              ok=False
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'UniAtivador2-Web-Check/1.1'})
                      with urllib.request.urlopen(req,timeout=12) as r:
                          body=r.read(160000).decode('utf-8','replace')
                          title=re.search(r'<title>(.*?)</title>',body,re.I|re.S)
                          hasNew='v5.9.0' in body or 'UniTV Free 5.9.0' in body
                          hasOld='v5.8.0' in body or 'UniTV%20Free%205.8.0.apk' in body
                          print('HTTP',r.status,'url',r.geturl(),'title',title.group(1)[:65] if title else None,'new',hasNew,'old',hasOld)
                          if r.status==200 and hasNew and not hasOld:
                              ok=True
                              break
                          else:
                              break
                  except Exception as e:
                      print('Attempt',attempt+1,'error',type(e).__name__,str(e)[:140])
                      if attempt<2:time.sleep(4)
              if ok:verified+=1
          print('verified',verified,'of',len(urls))
          assert verified==len(urls), 'GitHub Pages has not published all HTML updates yet'
          PY
