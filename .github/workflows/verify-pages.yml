name: Verificar site UniAtivador2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-pages.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirmar que GitHub Pages responde e apresenta o gerador
        run: |
          python3 - <<'PY'
          import urllib.request,time
          url='https://regisdutra.github.io/UniAtivador2/'
          for attempt in range(4):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'UniAtivador2-Web-Check/1.0'})
                  with urllib.request.urlopen(req,timeout=12) as r:
                      body=r.read(50000).decode('utf-8','replace')
                      print('HTTP',r.status,'URL',r.geturl(),'size-preview',len(body))
                      assert 'Gerador local de configurações' in body, 'Page does not contain expected HTML'
                      assert 'macAuto' in body and 'macManual' in body, 'MAC selector missing'
                      print('Web page verified OK')
                      raise SystemExit(0)
              except Exception as e:
                  print('Attempt',attempt+1,'not verified:',type(e).__name__,str(e)[:180])
                  if attempt < 3: time.sleep(6)
          raise SystemExit(1)
          PY
