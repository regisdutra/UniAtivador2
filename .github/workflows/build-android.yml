name: Compilar APK UniAtivador2 Android TV
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'docs/index.html'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || sdkmanager --version
      - name: Install Android API 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('docs/index.html').read_text(encoding='utf-8')
          js=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.I|re.S)
          assert js, 'Missing script'
          Path('/tmp/uni-page.js').write_text(js[-1])
          for marker in ['macManual','macAuto','AndroidLocal','key_sn_token_unitvfree']:
              assert marker in s, marker
          PY
          node --check /tmp/uni-page.js
      - name: Bundle web interface offline
        run: |
          mkdir -p android-app/app/src/main/assets
          cp docs/index.html android-app/app/src/main/assets/index.html
      - name: Assemble signed debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Check APK signature
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/UniAtivador2-AndroidTV-Teste.apk
          sha256sum dist/UniAtivador2-AndroidTV-Teste.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/UniAtivador2-AndroidTV-Teste.apk
      - name: Archive installable APK
        uses: actions/upload-artifact@v4
        with:
          name: UniAtivador2-AndroidTV-Teste
          path: dist/UniAtivador2-AndroidTV-Teste.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish test APK to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-teste >/dev/null 2>&1; then
            gh release upload v0.1.0-teste dist/UniAtivador2-AndroidTV-Teste.apk --clobber
          else
            gh release create v0.1.0-teste dist/UniAtivador2-AndroidTV-Teste.apk --title "UniAtivador2 Android TV — APK experimental" --notes "Gerador offline de arquivos de teste. Sem confirmação de ativação UniTV. Escrita em /Android/ depende da versão e das permissões do Android." --prerelease
          fi
