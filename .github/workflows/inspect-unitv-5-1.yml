name: Identificar carregador UniTV 5.1.0
on:
  push:
    paths:
      - '.github/workflows/inspect-unitv-5-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Find DEX class descriptors and native loaders in 5.1.0
        run: |
          python3 - <<'PY'
          import zipfile,struct,hashlib,json
          from pathlib import Path
          p=Path('apps/UniTV Free 5.1.0.apk')
          with zipfile.ZipFile(p) as z:
            dex=z.read('classes.dex')
            libs=[(x.filename,x.file_size) for x in z.infolist() if x.filename.endswith('.so')]
            assets=[x.filename for x in z.infolist() if x.filename.startswith('assets/')]
          u=lambda off:struct.unpack_from('<I',dex,off)[0]
          def strread(offs):
            p=offs
            while dex[p]&128:p+=1
            p+=1
            e=dex.index(0,p)
            return dex[p:e].decode('utf-8','replace')
          stroff=u(0x3c); strings=[]
          for i in range(u(0x38)):
            p=u(stroff+i*4)
            strings.append(strread(p))
          typeoff=u(0x44); classesoff=u(0x64)
          desc=[]
          for i in range(u(0x60)):
            cidx=u(classesoff+i*32)
            si=u(typeoff+cidx*4)
            desc.append(strings[si])
          needles=('stub','secneo','qihoo','shell','bangcle','ijiami','protect','appguard','wrapper','dex','load','lib','classloader')
          hints=[s for s in strings if len(s)<170 and any(n in s.lower() for n in needles)]
          d={'sha256':hashlib.sha256(p.read_bytes()).hexdigest() if False else hashlib.sha256(Path('apps/UniTV Free 5.1.0.apk').read_bytes()).hexdigest(),
            'classes':desc,'strings_count':len(strings),'hints':hints[:80],
            'libraries':libs,'assets_first_80':assets[:80]}
          print('=== LEGACY LOADER ===')
          print(json.dumps(d,ensure_ascii=False,indent=2))
          Path('unitv_5_1_loader.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
          PY
      - name: Save report
        uses: actions/upload-artifact@v4
        with:
          name: unitv-5-1-loader
          path: unitv_5_1_loader.json
          retention-days: 30
