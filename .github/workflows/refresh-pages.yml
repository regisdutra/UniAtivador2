name: Atualizar publicacao GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'docs/index.html'
      - '.github/workflows/refresh-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  request-pages-build:
    runs-on: ubuntu-latest
    steps:
      - name: Request build for configured Pages branch source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Requesting Pages rebuild for $GITHUB_REPOSITORY"
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
